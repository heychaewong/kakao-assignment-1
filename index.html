<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="app-title">Todo</h1>

      <!-- 일간 날짜 네비게이터 -->
      <div class="date-nav">
        <button id="prevDayBtn" class="date-nav-btn" aria-label="이전 날짜">&#8249;</button>
        <div class="date-nav-center">
          <span id="dateDisplay" class="date-display"></span>
          <button id="todayBtn" class="today-btn hidden">오늘</button>
        </div>
        <button id="nextDayBtn" class="date-nav-btn" aria-label="다음 날짜">&#8250;</button>
      </div>

      <!-- 주간 뷰 스트립 -->
      <div class="week-nav">
        <button id="prevWeekBtn" class="week-nav-btn" aria-label="이전 주">&#8249;</button>
        <div id="weekStrip" class="week-strip"></div>
        <button id="nextWeekBtn" class="week-nav-btn" aria-label="다음 주">&#8250;</button>
      </div>

      <!-- 입력 영역 -->
      <div class="input-area">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          maxlength="200"
        />
        <button id="addBtn" class="btn btn-primary">추가</button>
      </div>

      <!-- 빈 입력 안내 메시지 -->
      <p id="errorMsg" class="error-msg hidden">할 일을 입력해주세요.</p>

      <!-- 상태 필터 탭 -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- Todo 목록 -->
      <ul id="todoList" class="todo-list"></ul>

      <!-- Todo가 없을 때 빈 상태 안내 -->
      <p id="emptyMsg" class="empty-msg">등록된 할 일이 없습니다.</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
